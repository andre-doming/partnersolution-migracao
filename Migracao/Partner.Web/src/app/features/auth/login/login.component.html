<section class="login-page">
  <mat-card class="login-card">
    <img src="/assets/logo-bestoff-color.png" alt="BestOff" />
    <h1>Login</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Usuario</mat-label>
        <input matInput formControlName="login" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <button mat-flat-button color="primary" class="submit-btn" type="submit" [disabled]="isLoading">
        Entrar
      </button>

      <button mat-button type="button" class="recovery-btn">Recuperar senha</button>
    </form>
  </mat-card>
</section>
